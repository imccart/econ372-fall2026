project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.md"
    - "!README.md"
    - "!LICENSE.md"
    - "!CLAUDE.md"
  resources:
    - "files/"
    - "CNAME"

execute:
  # Re-render only when source changes
  freeze: auto

bibliography: files/bib/references.bib
csl: files/bib/chicago-author-date.csl
description-meta: "Course on the Economics of Health Care Markets at Emory University"

website:
  title: "Economics of Health Care Markets"
  site-url: "https://econ372f26.classes.ianmccarthyecon.com/"

  repo-url: "https://github.com/imccart/econ372-fall2026"

  page-navigation: false

  navbar:
    pinned: true
    background: primary
    right:
      - syllabus.qmd
      - text: "Schedule"
        file: schedule/index.qmd
      - text: "Assignments"
        file: assignments/index.qmd
      - text: "Resources"
        file: resources/index.qmd
      - icon: github
        href: "https://github.com/imccart/econ372-fall2026"
        aria-label: GitHub

  sidebar:
    - title: "Assignments"
      style: "docked"
      background: dark
      contents:
        - text: "Overview"
          file: assignments/index.qmd
        - text: "Class participation"
          href: assignments/index.qmd#class-participation
        - text: "Panels"
          href: assignments/index.qmd#sec-panels
        - text: "Simulations"
          href: assignments/index.qmd#simulations
        - text: "Quizzes"
          href: assignments/index.qmd#quizzes
        - text: "Midterm"
          href: assignments/index.qmd#midterm
        - section: "Empirical homework"
          href: assignments/index.qmd#empirical-homework
          contents:
            - text: "Homework 1"
              file: assignments/homework1.qmd
            - text: "Homework 2"
              file: assignments/homework2.qmd
            - text: "Homework 3"
              file: assignments/homework3.qmd

    - title: "Resources"
      style: "docked"
      background: dark
      contents:
        - resources/index.qmd

  page-footer:
    left: |
      Content {{< fa brands creative-commons >}} 2026 by Ian McCarthy<br>
      All content licensed under a {{< fa brands creative-commons >}}
      {{< fa brands creative-commons-by >}} {{< fa brands creative-commons-nc >}}
      [Creative Commons Attribution-NonCommercial 4.0 International license (CC BY-NC 4.0)](https://creativecommons.org/licenses/by-nc/4.0/)
    right: |
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)<br>
      [View the source at {{< fa brands github >}} GitHub](https://github.com/imccart/econ372-fall2026)


format:
  html:
    theme:
      - litera
      - html/custom.scss
    toc: true
    highlight-style: monokai
    grid:
      sidebar-width: 350px
